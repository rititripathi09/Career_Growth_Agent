[project]
name = "career-growth-agent"
version = "0.1.0"
description = "AI career growth agent: private coaching for employees, privacy-safe team views for leaders"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.50",
    "openai>=1.50",
    "pydantic>=2.7",
    "plotly>=5.22",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pypdf>=4.0",
    "python-docx>=1.1",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
